<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0b">
  <title>Living Elarindor — Nighttime Bed Stage 3 Review</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0b0b;
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0b0b;
      isolation: isolate;
    }

    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      z-index: 0;
    }

    .ambient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    /* Deliberately stronger than the final target so we can verify motion
       is visible on the Den TV before dialing it back. */
    .moon-wash {
      position: absolute;
      right: -12vw;
      top: -8vh;
      width: 72vw;
      height: 112vh;
      background: radial-gradient(
        ellipse at 72% 34%,
        rgba(188, 211, 255, .24) 0%,
        rgba(145, 177, 235, .14) 30%,
        rgba(105, 137, 198, .07) 52%,
        rgba(0, 0, 0, 0) 76%
      );
      opacity: .42;
      transform: translate3d(-18px, 0, 0) scale(1);
      animation: moon-wash 8s ease-in-out infinite alternate;
      will-change: opacity, transform;
      mix-blend-mode: screen;
    }

    .moon-beam {
      position: absolute;
      right: -20vw;
      top: 10vh;
      width: 58vw;
      height: 88vh;
      background: linear-gradient(
        118deg,
        rgba(167, 196, 246, 0) 0%,
        rgba(167, 196, 246, .04) 30%,
        rgba(180, 207, 250, .18) 48%,
        rgba(167, 196, 246, .05) 64%,
        rgba(167, 196, 246, 0) 100%
      );
      filter: blur(10px);
      opacity: .42;
      transform: translate3d(10px, 0, 0) skewX(-8deg);
      animation: moon-beam-drift 10s ease-in-out infinite alternate;
      will-change: opacity, transform;
      mix-blend-mode: screen;
    }

    .candle-glow {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(255, 211, 126, .34) 0%,
        rgba(255, 164, 67, .19) 32%,
        rgba(220, 105, 36, .08) 55%,
        rgba(0, 0, 0, 0) 76%
      );
      opacity: .42;
      transform: scale(.96);
      animation: candle-pulse 1.55s ease-in-out infinite alternate;
      will-change: opacity, transform;
      mix-blend-mode: screen;
    }

    .candle-left {
      left: -2vw;
      top: 18vh;
      width: 30vw;
      height: 44vh;
      animation-duration: 1.45s;
    }

    .candle-center {
      left: 42vw;
      top: 34vh;
      width: 27vw;
      height: 38vh;
      animation-duration: 1.95s;
      animation-delay: -.7s;
    }

    .candle-right {
      right: -2vw;
      top: 25vh;
      width: 25vw;
      height: 36vh;
      animation-duration: 1.7s;
      animation-delay: -1.1s;
    }

    .warm-breathe {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at 42% 46%,
        rgba(255, 169, 78, .08) 0%,
        rgba(255, 153, 65, .035) 38%,
        rgba(0, 0, 0, 0) 70%
      );
      opacity: .35;
      animation: warm-breathe 6.5s ease-in-out infinite alternate;
      will-change: opacity;
      mix-blend-mode: screen;
    }

    .mote {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 226, 173, .86);
      box-shadow: 0 0 8px rgba(255, 205, 126, .48);
      opacity: .18;
      animation: mote-drift 7s ease-in-out infinite alternate;
      will-change: opacity, transform;
    }

    .m1 { left: 58%; top: 26%; animation-duration: 8s; }
    .m2 { left: 66%; top: 40%; animation-duration: 6.5s; animation-delay: -3s; }
    .m3 { left: 75%; top: 22%; animation-duration: 9s; animation-delay: -5s; }
    .m4 { left: 54%; top: 55%; animation-duration: 7.5s; animation-delay: -2s; }
    .m5 { left: 82%; top: 47%; animation-duration: 8.5s; animation-delay: -4s; }
    .m6 { left: 72%; top: 61%; animation-duration: 7s; animation-delay: -1s; }
    .m7 { left: 88%; top: 33%; animation-duration: 9.5s; animation-delay: -6s; }
    .m8 { left: 61%; top: 67%; animation-duration: 8s; animation-delay: -4.5s; }

    @keyframes candle-pulse {
      0%   { opacity: .24; transform: scale(.93); }
      28%  { opacity: .58; transform: scale(1.03); }
      55%  { opacity: .34; transform: scale(.98); }
      78%  { opacity: .70; transform: scale(1.06); }
      100% { opacity: .43; transform: scale(1.01); }
    }

    @keyframes moon-wash {
      0%   { opacity: .24; transform: translate3d(-22px, 0, 0) scale(.985); }
      100% { opacity: .58; transform: translate3d(18px, 2px, 0) scale(1.025); }
    }

    @keyframes moon-beam-drift {
      0%   { opacity: .20; transform: translate3d(-18px, -2px, 0) skewX(-9deg); }
      100% { opacity: .58; transform: translate3d(28px, 4px, 0) skewX(-6deg); }
    }

    @keyframes warm-breathe {
      0%   { opacity: .18; }
      100% { opacity: .48; }
    }

    @keyframes mote-drift {
      0%   { opacity: .06; transform: translate3d(0, 0, 0) scale(.75); }
      40%  { opacity: .72; }
      100% { opacity: .12; transform: translate3d(34px, -26px, 0) scale(1.28); }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Nighttime Bed living animation development review">
    <img
      class="scene-image"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt="Nighttime Bed character staging artwork">

    <div class="ambient" aria-hidden="true">
      <div class="moon-wash"></div>
      <div class="moon-beam"></div>
      <div class="warm-breathe"></div>
      <div class="candle-glow candle-left"></div>
      <div class="candle-glow candle-center"></div>
      <div class="candle-glow candle-right"></div>
      <i class="mote m1"></i>
      <i class="mote m2"></i>
      <i class="mote m3"></i>
      <i class="mote m4"></i>
      <i class="mote m5"></i>
      <i class="mote m6"></i>
      <i class="mote m7"></i>
      <i class="mote m8"></i>
    </div>
  </main>
</body>
</html>
