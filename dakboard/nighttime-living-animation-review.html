<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0b">
  <title>Living Elarindor — Nighttime Bed Stage 3.3 Review</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0b0b;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0b0b;
    }

    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      z-index: 0;
    }

    .ambient {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .moon-wash {
      position: absolute;
      right: -7vw;
      top: -6vh;
      width: 49vw;
      height: 104vh;
      background: radial-gradient(
        ellipse at 79% 30%,
        rgba(145, 181, 255, .22) 0%,
        rgba(111, 147, 220, .14) 34%,
        rgba(71, 104, 171, .06) 57%,
        rgba(0, 0, 0, 0) 76%
      );
      opacity: .22;
      transform: translate3d(-16px, 0, 0) scale(.98);
      animation: moon-drift 8.5s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    .moon-beam {
      position: absolute;
      right: 0;
      top: 3vh;
      width: 39vw;
      height: 91vh;
      background: linear-gradient(
        113deg,
        rgba(105, 148, 231, 0) 0%,
        rgba(116, 157, 234, .02) 20%,
        rgba(138, 177, 245, .12) 48%,
        rgba(112, 153, 228, .03) 68%,
        rgba(88, 126, 200, 0) 100%
      );
      opacity: .18;
      transform: translate3d(-22px, 0, 0) skewX(-7deg);
      animation: beam-drift 10s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    .flame {
      position: absolute;
      width: .72vw;
      min-width: 7px;
      height: 2.6vh;
      min-height: 18px;
      border-radius: 55% 55% 45% 45%;
      background: radial-gradient(
        ellipse at 50% 64%,
        rgba(255,255,218,1) 0%,
        rgba(255,224,124,.98) 29%,
        rgba(255,160,43,.9) 58%,
        rgba(255,92,20,.32) 80%,
        rgba(255,92,20,0) 100%
      );
      transform-origin: 50% 100%;
      filter: blur(.15px);
      box-shadow:
        0 0 7px rgba(255, 216, 123, .90),
        0 0 15px rgba(255, 157, 45, .58),
        0 0 24px rgba(255, 106, 25, .22);
      opacity: .90;
      animation: flame-flicker 1.05s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    .flame-left  { left: 8.0%;  top: 36.3%; animation-duration: .92s; }
    .flame-right { left: 96.0%; top: 36.1%; animation-duration: 1.03s; animation-delay: -.71s; }

    .candle-halo {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(255, 205, 112, .24) 0%,
        rgba(255, 150, 56, .10) 38%,
        rgba(255, 100, 29, .025) 61%,
        rgba(0,0,0,0) 78%
      );
      opacity: .22;
      transform: scale(.94);
      animation: halo-flicker 1.65s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    .halo-left {
      left: 1vw;
      top: 27vh;
      width: 15vw;
      height: 22vh;
      animation-duration: 1.42s;
    }

    .halo-right {
      right: -1vw;
      top: 28vh;
      width: 13vw;
      height: 20vh;
      animation-duration: 1.67s;
      animation-delay: -.9s;
    }

    .mote {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 226, 169, .9);
      box-shadow: 0 0 6px rgba(255, 205, 122, .62);
      opacity: .12;
      animation: mote-drift 7s linear infinite;
      will-change: transform, opacity;
    }

    .m1 { left: 61%; top: 32%; animation-duration: 8s; }
    .m2 { left: 69%; top: 46%; animation-duration: 6.5s; animation-delay: -2s; }
    .m3 { left: 76%; top: 27%; animation-duration: 9s; animation-delay: -5s; }
    .m4 { left: 57%; top: 58%; animation-duration: 7.5s; animation-delay: -3s; }
    .m5 { left: 84%; top: 50%; animation-duration: 8.5s; animation-delay: -6s; }
    .m6 { left: 72%; top: 66%; animation-duration: 7.2s; animation-delay: -1s; }

    @keyframes flame-flicker {
      0%   { transform: translate3d(-1px, 1px, 0) scale(.82, 1.12) rotate(-3deg); opacity: .72; }
      35%  { transform: translate3d(1px, -1px, 0) scale(1.04, .94) rotate(2deg); opacity: 1; }
      70%  { transform: translate3d(-1px, 0, 0) scale(.91, 1.06) rotate(-1deg); opacity: .84; }
      100% { transform: translate3d(2px, -2px, 0) scale(1.09, .88) rotate(3deg); opacity: .96; }
    }

    @keyframes halo-flicker {
      0%   { opacity: .13; transform: scale(.92); }
      35%  { opacity: .31; transform: scale(1.01); }
      70%  { opacity: .18; transform: scale(.96); }
      100% { opacity: .34; transform: scale(1.05); }
    }

    @keyframes moon-drift {
      0%   { opacity: .14; transform: translate3d(-18px, 0, 0) scale(.98); }
      100% { opacity: .30; transform: translate3d(14px, 2px, 0) scale(1.025); }
    }

    @keyframes beam-drift {
      0%   { opacity: .08; transform: translate3d(-24px, 0, 0) skewX(-8deg); }
      100% { opacity: .24; transform: translate3d(22px, 4px, 0) skewX(-5deg); }
    }

    @keyframes mote-drift {
      0%   { opacity: 0; transform: translate3d(0, 12px, 0) scale(.75); }
      18%  { opacity: .72; }
      68%  { opacity: .46; }
      100% { opacity: 0; transform: translate3d(42px, -42px, 0) scale(1.25); }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Nighttime Bed living animation development review">
    <img
      class="scene-image"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt="Nighttime Bed character staging artwork">

    <div class="ambient" aria-hidden="true">
      <div class="moon-wash"></div>
      <div class="moon-beam"></div>

      <div class="candle-halo halo-left"></div>
      <div class="candle-halo halo-right"></div>
      <i class="flame flame-left"></i>
      <i class="flame flame-right"></i>

      <i class="mote m1"></i>
      <i class="mote m2"></i>
      <i class="mote m3"></i>
      <i class="mote m4"></i>
      <i class="mote m5"></i>
      <i class="mote m6"></i>
    </div>
  </main>
</body>
</html>
