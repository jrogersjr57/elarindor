<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0b">
  <title>Living Elarindor — Nighttime Bed Stage 3.1 Review</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0b0b;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0b0b;
    }

    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      z-index: 0;
    }

    .ambient {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    /* Keep effects simple and compositor-friendly for DAKboard/Roku.
       No blend modes: only opacity + transform + box-shadow. */

    .moon-wash {
      position: absolute;
      right: -7vw;
      top: -6vh;
      width: 49vw;
      height: 104vh;
      background: radial-gradient(
        ellipse at 79% 30%,
        rgba(145, 181, 255, .26) 0%,
        rgba(111, 147, 220, .17) 34%,
        rgba(71, 104, 171, .08) 57%,
        rgba(0, 0, 0, 0) 76%
      );
      opacity: .26;
      transform: translate3d(-16px, 0, 0) scale(.98);
      animation: moon-drift 7.5s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    .moon-beam {
      position: absolute;
      right: 0;
      top: 3vh;
      width: 39vw;
      height: 91vh;
      background: linear-gradient(
        113deg,
        rgba(105, 148, 231, 0) 0%,
        rgba(116, 157, 234, .02) 20%,
        rgba(138, 177, 245, .15) 48%,
        rgba(112, 153, 228, .04) 68%,
        rgba(88, 126, 200, 0) 100%
      );
      opacity: .22;
      transform: translate3d(-22px, 0, 0) skewX(-7deg);
      animation: beam-drift 9s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    .warm-room {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at 34% 39%,
        rgba(255, 165, 71, .13) 0%,
        rgba(255, 135, 48, .06) 38%,
        rgba(0, 0, 0, 0) 68%
      );
      opacity: .24;
      animation: warm-room 5.5s ease-in-out infinite alternate;
      will-change: opacity;
    }

    /* Actual visible flame sprites aligned to the three clearest candles. */
    .flame {
      position: absolute;
      width: .72vw;
      min-width: 7px;
      height: 2.6vh;
      min-height: 18px;
      border-radius: 55% 55% 45% 45%;
      background: radial-gradient(
        ellipse at 50% 64%,
        rgba(255,255,218,1) 0%,
        rgba(255,224,124,.98) 29%,
        rgba(255,160,43,.9) 58%,
        rgba(255,92,20,.32) 80%,
        rgba(255,92,20,0) 100%
      );
      transform-origin: 50% 100%;
      filter: blur(.15px);
      box-shadow:
        0 0 8px rgba(255, 216, 123, .95),
        0 0 18px rgba(255, 157, 45, .72),
        0 0 36px rgba(255, 106, 25, .34);
      opacity: .92;
      animation: flame-flicker 1.05s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    /* Approximate positions in the approved 1536×1024 artwork. */
    .flame-left   { left: 8.0%;  top: 36.3%; animation-duration: .92s; }
    .flame-center { left: 53.3%; top: 36.2%; animation-duration: 1.17s; animation-delay: -.37s; }
    .flame-right  { left: 96.0%; top: 36.1%; animation-duration: 1.03s; animation-delay: -.71s; }

    .candle-halo {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(255, 205, 112, .22) 0%,
        rgba(255, 150, 56, .11) 40%,
        rgba(255, 100, 29, .04) 62%,
        rgba(0,0,0,0) 78%
      );
      opacity: .25;
      transform: scale(.92);
      animation: halo-flicker 1.55s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    .halo-left {
      left: -2vw;
      top: 23vh;
      width: 22vw;
      height: 34vh;
      animation-duration: 1.42s;
    }

    .halo-center {
      left: 45vw;
      top: 25vh;
      width: 18vw;
      height: 29vh;
      animation-duration: 1.84s;
      animation-delay: -.6s;
    }

    .halo-right {
      right: -3vw;
      top: 24vh;
      width: 18vw;
      height: 30vh;
      animation-duration: 1.67s;
      animation-delay: -.9s;
    }

    .mote {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 226, 169, .9);
      box-shadow: 0 0 6px rgba(255, 205, 122, .62);
      opacity: .12;
      animation: mote-drift 7s linear infinite;
      will-change: transform, opacity;
    }

    .m1 { left: 61%; top: 32%; animation-duration: 8s; }
    .m2 { left: 69%; top: 46%; animation-duration: 6.5s; animation-delay: -2s; }
    .m3 { left: 76%; top: 27%; animation-duration: 9s; animation-delay: -5s; }
    .m4 { left: 57%; top: 58%; animation-duration: 7.5s; animation-delay: -3s; }
    .m5 { left: 84%; top: 50%; animation-duration: 8.5s; animation-delay: -6s; }
    .m6 { left: 72%; top: 66%; animation-duration: 7.2s; animation-delay: -1s; }

    @keyframes flame-flicker {
      0%   { transform: translate3d(-1px, 1px, 0) scale(.82, 1.12) rotate(-3deg); opacity: .72; }
      35%  { transform: translate3d(1px, -1px, 0) scale(1.04, .94) rotate(2deg); opacity: 1; }
      70%  { transform: translate3d(-1px, 0, 0) scale(.91, 1.06) rotate(-1deg); opacity: .84; }
      100% { transform: translate3d(2px, -2px, 0) scale(1.09, .88) rotate(3deg); opacity: .96; }
    }

    @keyframes halo-flicker {
      0%   { opacity: .16; transform: scale(.89); }
      30%  { opacity: .39; transform: scale(1.02); }
      62%  { opacity: .23; transform: scale(.95); }
      100% { opacity: .46; transform: scale(1.08); }
    }

    @keyframes moon-drift {
      0%   { opacity: .16; transform: translate3d(-20px, 0, 0) scale(.97); }
      100% { opacity: .40; transform: translate3d(17px, 2px, 0) scale(1.035); }
    }

    @keyframes beam-drift {
      0%   { opacity: .10; transform: translate3d(-28px, 0, 0) skewX(-8deg); }
      100% { opacity: .34; transform: translate3d(26px, 4px, 0) skewX(-5deg); }
    }

    @keyframes warm-room {
      0%   { opacity: .16; }
      100% { opacity: .36; }
    }

    @keyframes mote-drift {
      0%   { opacity: 0; transform: translate3d(0, 12px, 0) scale(.75); }
      18%  { opacity: .72; }
      68%  { opacity: .46; }
      100% { opacity: 0; transform: translate3d(42px, -42px, 0) scale(1.25); }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Nighttime Bed living animation development review">
    <img
      class="scene-image"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt="Nighttime Bed character staging artwork">

    <div class="ambient" aria-hidden="true">
      <div class="moon-wash"></div>
      <div class="moon-beam"></div>
      <div class="warm-room"></div>

      <div class="candle-halo halo-left"></div>
      <div class="candle-halo halo-center"></div>
      <div class="candle-halo halo-right"></div>
      <i class="flame flame-left"></i>
      <i class="flame flame-center"></i>
      <i class="flame flame-right"></i>

      <i class="mote m1"></i>
      <i class="mote m2"></i>
      <i class="mote m3"></i>
      <i class="mote m4"></i>
      <i class="mote m5"></i>
      <i class="mote m6"></i>
    </div>
  </main>
</body>
</html>
