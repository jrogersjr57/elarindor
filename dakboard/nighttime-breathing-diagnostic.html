<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0b">
  <title>Living Elarindor — Breathing Diagnostic v7</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0b0b;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0b0b;
    }

    .scene-image,
    .breath-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    .scene-image { z-index: 0; }

    /* Diagnostic v7: combines the approved isolation settings unchanged:
       Vaelyn v4 + Toma v3. */
    .breath-layer {
      z-index: 1;
      pointer-events: none;
      will-change: transform;
    }

    .breath-vaelyn {
      transform-origin: 40.5% 56%;
      -webkit-mask-image: radial-gradient(
        ellipse 7.5% 5.2% at 40.5% 52.5%,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,.90) 32%,
        rgba(0,0,0,.52) 56%,
        rgba(0,0,0,.16) 77%,
        rgba(0,0,0,0) 100%
      );
      mask-image: radial-gradient(
        ellipse 7.5% 5.2% at 40.5% 52.5%,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,.90) 32%,
        rgba(0,0,0,.52) 56%,
        rgba(0,0,0,.16) 77%,
        rgba(0,0,0,0) 100%
      );
      animation: breathe-vaelyn 8s cubic-bezier(.42,0,.58,1) infinite;
    }

    .breath-toma {
      transform-origin: 46% 52%;
      -webkit-mask-image: radial-gradient(
        ellipse 9% 5.8% at 46% 48.5%,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,.94) 34%,
        rgba(0,0,0,.60) 58%,
        rgba(0,0,0,.20) 78%,
        rgba(0,0,0,0) 100%
      );
      mask-image: radial-gradient(
        ellipse 9% 5.8% at 46% 48.5%,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,.94) 34%,
        rgba(0,0,0,.60) 58%,
        rgba(0,0,0,.20) 78%,
        rgba(0,0,0,0) 100%
      );
      animation: breathe-toma 8.6s cubic-bezier(.42,0,.58,1) infinite;
    }

    @keyframes breathe-vaelyn {
      0%, 100% { transform: translate3d(0, 0, 0) scaleY(1); }
      42%      { transform: translate3d(0, -4px, 0) scaleY(1.014); }
      58%      { transform: translate3d(0, -4px, 0) scaleY(1.014); }
    }

    @keyframes breathe-toma {
      0%, 100% { transform: translate3d(0, 0, 0) scaleY(1); }
      42%      { transform: translate3d(0, -4px, 0) scaleY(1.016); }
      58%      { transform: translate3d(0, -4px, 0) scaleY(1.016); }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Nighttime Bed two-person breathing diagnostic">
    <img
      class="scene-image"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt="Nighttime Bed character staging artwork">

    <img
      class="breath-layer breath-vaelyn"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt=""
      aria-hidden="true">

    <img
      class="breath-layer breath-toma"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt=""
      aria-hidden="true">
  </main>
</body>
</html>
