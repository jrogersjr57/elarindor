<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0b">
  <title>Living Elarindor — Breathing Diagnostic</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0b0b;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0b0b;
    }

    .scene-image,
    .breath-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    .scene-image { z-index: 0; }

    /* Diagnostic only: camera drift and ambient overlays are disabled so the
       localized bedding motion can be judged by itself. This is intentionally
       stronger than the eventual final breathing effect. */
    .breath-layer {
      z-index: 1;
      pointer-events: none;
      transform-origin: 39% 58%;
      -webkit-mask-image: radial-gradient(
        ellipse 25% 14% at 39% 54%,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,.98) 38%,
        rgba(0,0,0,.68) 60%,
        rgba(0,0,0,.28) 78%,
        rgba(0,0,0,0) 100%
      );
      mask-image: radial-gradient(
        ellipse 25% 14% at 39% 54%,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,.98) 38%,
        rgba(0,0,0,.68) 60%,
        rgba(0,0,0,.28) 78%,
        rgba(0,0,0,0) 100%
      );
      animation: bedding-breathe-test 4.8s cubic-bezier(.42,0,.58,1) infinite;
      will-change: transform;
    }

    @keyframes bedding-breathe-test {
      0%, 100% { transform: translate3d(0, 0, 0) scaleY(1); }
      42%      { transform: translate3d(0, -6px, 0) scaleY(1.025); }
      58%      { transform: translate3d(0, -6px, 0) scaleY(1.025); }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Nighttime Bed breathing diagnostic">
    <img
      class="scene-image"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt="Nighttime Bed character staging artwork">

    <img
      class="breath-layer"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt=""
      aria-hidden="true">
  </main>
</body>
</html>
