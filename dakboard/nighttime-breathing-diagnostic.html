<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0b">
  <title>Living Elarindor — Breathing Diagnostic v4</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0b0b;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0b0b;
    }

    .scene-image,
    .breath-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    .scene-image { z-index: 0; }

    /* Diagnostic v4: two smaller breathing zones instead of one broad shared
       bedding patch. Each zone has its own pace and phase so the blanket reads
       as two people breathing beneath it rather than one large rise/fall. */
    .breath-layer {
      z-index: 1;
      pointer-events: none;
      will-change: transform;
    }

    .breath-vaelyn {
      transform-origin: 33.5% 64%;
      -webkit-mask-image: radial-gradient(
        ellipse 14% 9% at 33.5% 60%,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,.92) 34%,
        rgba(0,0,0,.58) 58%,
        rgba(0,0,0,.20) 78%,
        rgba(0,0,0,0) 100%
      );
      mask-image: radial-gradient(
        ellipse 14% 9% at 33.5% 60%,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,.92) 34%,
        rgba(0,0,0,.58) 58%,
        rgba(0,0,0,.20) 78%,
        rgba(0,0,0,0) 100%
      );
      animation: breathe-vaelyn 7.6s cubic-bezier(.42,0,.58,1) infinite;
    }

    .breath-toma {
      transform-origin: 45.5% 64%;
      -webkit-mask-image: radial-gradient(
        ellipse 15% 9% at 45.5% 60%,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,.92) 34%,
        rgba(0,0,0,.58) 58%,
        rgba(0,0,0,.20) 78%,
        rgba(0,0,0,0) 100%
      );
      mask-image: radial-gradient(
        ellipse 15% 9% at 45.5% 60%,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,.92) 34%,
        rgba(0,0,0,.58) 58%,
        rgba(0,0,0,.20) 78%,
        rgba(0,0,0,0) 100%
      );
      animation: breathe-toma 8.4s cubic-bezier(.42,0,.58,1) infinite;
      animation-delay: -1.7s;
    }

    @keyframes breathe-vaelyn {
      0%, 100% { transform: translate3d(0, 0, 0) scaleY(1); }
      42%      { transform: translate3d(0, -3px, 0) scaleY(1.014); }
      58%      { transform: translate3d(0, -3px, 0) scaleY(1.014); }
    }

    @keyframes breathe-toma {
      0%, 100% { transform: translate3d(0, 0, 0) scaleY(1); }
      42%      { transform: translate3d(0, -3px, 0) scaleY(1.013); }
      58%      { transform: translate3d(0, -3px, 0) scaleY(1.013); }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Nighttime Bed two-person breathing diagnostic">
    <img
      class="scene-image"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt="Nighttime Bed character staging artwork">

    <img
      class="breath-layer breath-vaelyn"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt=""
      aria-hidden="true">

    <img
      class="breath-layer breath-toma"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt=""
      aria-hidden="true">
  </main>
</body>
</html>
