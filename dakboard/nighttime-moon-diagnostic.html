<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0b">
  <title>Living Elarindor — Moon Cloud Cover Diagnostic v5</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0b0b;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0b0b;
    }

    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      z-index: 0;
    }

    /* Still intentionally visible for TV testing. */
    .room-dim {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: rgba(4, 8, 18, .26);
      opacity: 0;
      animation: room-moon-dim 16s ease-in-out infinite;
      will-change: opacity;
    }

    /* Approximate outer window opening in the approved staging image.
       The cloud is no longer shown through one large rectangle. Instead it is
       revealed only through pane-sized clips, so the painted wooden frame and
       mullions stay visually in front of the cloud. */
    .window-zone {
      position: absolute;
      left: 77.0%;
      top: 2.5%;
      width: 15.5vw;
      height: 34.5vh;
      z-index: 2;
      pointer-events: none;
    }

    .pane {
      position: absolute;
      overflow: hidden;
    }

    /* Three glass columns with the mullions left uncovered. */
    .c1 { left: 2%;  width: 14%; }
    .c2 { left: 20%; width: 55%; }
    .c3 { left: 79%; width: 18%; }

    /* Four glass rows with the horizontal bars left uncovered. */
    .r1 { top: 2%;  height: 21%; }
    .r2 { top: 28%; height: 19%; }
    .r3 { top: 52%; height: 20%; }
    .r4 { top: 77%; height: 20%; }

    /*
      Each pane contains the same full-window cloud canvas, offset back to the
      same origin. This preserves one continuous cloud motion while the pane
      clips hide it wherever the wooden frame is painted.
    */
    .cloud-canvas {
      position: absolute;
      width: 15.5vw;
      height: 34.5vh;
      left: var(--ox);
      top: var(--oy);
    }

    .c1 .cloud-canvas { --ox: -0.31vw; }
    .c2 .cloud-canvas { --ox: -3.10vw; }
    .c3 .cloud-canvas { --ox: -12.25vw; }

    .r1 .cloud-canvas { --oy: -0.69vh; }
    .r2 .cloud-canvas { --oy: -9.66vh; }
    .r3 .cloud-canvas { --oy: -17.94vh; }
    .r4 .cloud-canvas { --oy: -26.57vh; }

    .cloud-track {
      position: absolute;
      inset: 0;
      animation: cloud-crossing-test 16s linear infinite;
      will-change: transform, opacity;
    }

    .cloud-main {
      position: absolute;
      left: 2%;
      top: 5%;
      width: 94%;
      height: 31%;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 10% 58%, rgba(111,126,150,.88) 0 18%, rgba(73,88,112,.70) 26%, rgba(39,52,76,0) 47%),
        radial-gradient(ellipse at 29% 44%, rgba(126,141,166,.90) 0 22%, rgba(80,94,120,.74) 33%, rgba(41,54,79,0) 53%),
        radial-gradient(ellipse at 50% 55%, rgba(106,122,148,.92) 0 27%, rgba(66,82,109,.78) 38%, rgba(36,49,73,0) 59%),
        radial-gradient(ellipse at 71% 44%, rgba(123,138,164,.88) 0 24%, rgba(77,92,119,.71) 34%, rgba(39,52,76,0) 54%),
        radial-gradient(ellipse at 91% 58%, rgba(101,116,141,.83) 0 18%, rgba(65,79,104,.65) 29%, rgba(34,47,70,0) 49%),
        linear-gradient(180deg, rgba(76,91,116,.53), rgba(41,54,78,.72) 55%, rgba(31,43,64,.34));
      filter: blur(1.2px);
      box-shadow: 0 8px 22px rgba(5,10,22,.28);
      opacity: .95;
    }

    .cloud-wisp {
      position: absolute;
      left: 12%;
      top: 25%;
      width: 76%;
      height: 12%;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 30% 50%, rgba(87,103,128,.48) 0 28%, rgba(55,70,95,0) 67%),
        radial-gradient(ellipse at 70% 50%, rgba(77,92,117,.43) 0 30%, rgba(48,62,86,0) 68%);
      filter: blur(4px);
      opacity: .84;
    }

    /* Separate dimming overlay for the baked-in moon. It is also clipped to
       the top-center/right glass area so it cannot spill onto the frame. */
    .moon-dim-pane {
      position: absolute;
      left: 20%;
      top: 2%;
      width: 77%;
      height: 45%;
      overflow: hidden;
      z-index: 3;
    }

    .moon-veil {
      position: absolute;
      left: 49%;
      top: 1%;
      width: 45%;
      height: 38%;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(16,25,43,.92) 0%,
        rgba(21,32,53,.78) 38%,
        rgba(26,39,63,.40) 65%,
        rgba(0,0,0,0) 100%
      );
      filter: blur(4px);
      opacity: 0;
      animation: moon-veil-dim 16s ease-in-out infinite;
      will-change: opacity;
    }

    .diagnostic-note {
      position: absolute;
      left: 1.2vw;
      bottom: 1.2vh;
      z-index: 4;
      padding: .45rem .7rem;
      border-radius: .35rem;
      background: rgba(0,0,0,.55);
      color: rgba(255,255,255,.90);
      font: 600 13px/1.2 system-ui, -apple-system, sans-serif;
      letter-spacing: .02em;
      pointer-events: none;
    }

    @keyframes cloud-crossing-test {
      0%, 7% {
        transform: translate3d(118%, 0, 0);
        opacity: 0;
      }
      12% {
        transform: translate3d(98%, 0, 0);
        opacity: 1;
      }
      38% {
        transform: translate3d(24%, 0, 0);
        opacity: 1;
      }
      56% {
        transform: translate3d(-10%, 0, 0);
        opacity: 1;
      }
      86% {
        transform: translate3d(-104%, 2%, 0);
        opacity: 1;
      }
      92%, 100% {
        transform: translate3d(-124%, 2%, 0);
        opacity: 0;
      }
    }

    @keyframes moon-veil-dim {
      0%, 24%, 76%, 100% { opacity: 0; }
      36% { opacity: .30; }
      45%, 59% { opacity: .95; }
      68% { opacity: .34; }
    }

    @keyframes room-moon-dim {
      0%, 25%, 75%, 100% { opacity: 0; }
      37% { opacity: .24; }
      46%, 59% { opacity: .72; }
      68% { opacity: .28; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Nighttime moon cloud-cover diagnostic">
    <img
      class="scene-image"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt="Nighttime Bed character staging artwork">

    <div class="room-dim" aria-hidden="true"></div>

    <div class="window-zone" aria-hidden="true">
      <div class="pane c1 r1"><div class="cloud-canvas"><div class="cloud-track"><div class="cloud-main"></div><div class="cloud-wisp"></div></div></div></div>
      <div class="pane c2 r1"><div class="cloud-canvas"><div class="cloud-track"><div class="cloud-main"></div><div class="cloud-wisp"></div></div></div></div>
      <div class="pane c3 r1"><div class="cloud-canvas"><div class="cloud-track"><div class="cloud-main"></div><div class="cloud-wisp"></div></div></div></div>

      <div class="pane c1 r2"><div class="cloud-canvas"><div class="cloud-track"><div class="cloud-main"></div><div class="cloud-wisp"></div></div></div></div>
      <div class="pane c2 r2"><div class="cloud-canvas"><div class="cloud-track"><div class="cloud-main"></div><div class="cloud-wisp"></div></div></div></div>
      <div class="pane c3 r2"><div class="cloud-canvas"><div class="cloud-track"><div class="cloud-main"></div><div class="cloud-wisp"></div></div></div></div>

      <div class="pane c1 r3"><div class="cloud-canvas"><div class="cloud-track"><div class="cloud-main"></div><div class="cloud-wisp"></div></div></div></div>
      <div class="pane c2 r3"><div class="cloud-canvas"><div class="cloud-track"><div class="cloud-main"></div><div class="cloud-wisp"></div></div></div></div>
      <div class="pane c3 r3"><div class="cloud-canvas"><div class="cloud-track"><div class="cloud-main"></div><div class="cloud-wisp"></div></div></div></div>

      <div class="pane c1 r4"><div class="cloud-canvas"><div class="cloud-track"><div class="cloud-main"></div><div class="cloud-wisp"></div></div></div></div>
      <div class="pane c2 r4"><div class="cloud-canvas"><div class="cloud-track"><div class="cloud-main"></div><div class="cloud-wisp"></div></div></div></div>
      <div class="pane c3 r4"><div class="cloud-canvas"><div class="cloud-track"><div class="cloud-main"></div><div class="cloud-wisp"></div></div></div></div>

      <div class="moon-dim-pane"><div class="moon-veil"></div></div>
    </div>

    <div class="diagnostic-note">CLOUD TEST v5 · pane-clipped 16s crossing</div>
  </main>
</body>
</html>
