<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0b">
  <title>Living Elarindor — Moon Cloud Cover Diagnostic v4</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0b0b;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0b0b;
    }

    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      z-index: 0;
    }

    /* Deliberately stronger than production so we can verify the effect
       from across the room before dialing it back. */
    .room-dim {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: rgba(4, 8, 18, .28);
      opacity: 0;
      animation: room-moon-dim 16s ease-in-out infinite;
      will-change: opacity;
    }

    /* Window calibration region for the approved staging image. */
    .window-zone {
      position: absolute;
      left: 76.2%;
      top: 0.3%;
      width: 17.8%;
      height: 41.5%;
      overflow: hidden;
      z-index: 2;
      pointer-events: none;
    }

    /* Darkens the baked-in moon while the cloud is directly over it. */
    .moon-veil {
      position: absolute;
      left: 48%;
      top: 4%;
      width: 43%;
      height: 29%;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(16, 25, 43, .94) 0%,
        rgba(21, 32, 53, .80) 38%,
        rgba(26, 39, 63, .42) 65%,
        rgba(0, 0, 0, 0) 100%
      );
      filter: blur(4px);
      opacity: 0;
      animation: moon-veil-dim 16s ease-in-out infinite;
      will-change: opacity;
    }

    .cloud-track {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      animation: cloud-crossing-test 16s linear infinite;
      will-change: transform, opacity;
    }

    .cloud-main {
      position: absolute;
      left: 2%;
      top: 5%;
      width: 94%;
      height: 31%;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 10% 58%, rgba(111, 126, 150, .90) 0 18%, rgba(73, 88, 112, .72) 26%, rgba(39, 52, 76, 0) 47%),
        radial-gradient(ellipse at 29% 44%, rgba(126, 141, 166, .93) 0 22%, rgba(80, 94, 120, .76) 33%, rgba(41, 54, 79, 0) 53%),
        radial-gradient(ellipse at 50% 55%, rgba(106, 122, 148, .95) 0 27%, rgba(66, 82, 109, .80) 38%, rgba(36, 49, 73, 0) 59%),
        radial-gradient(ellipse at 71% 44%, rgba(123, 138, 164, .90) 0 24%, rgba(77, 92, 119, .73) 34%, rgba(39, 52, 76, 0) 54%),
        radial-gradient(ellipse at 91% 58%, rgba(101, 116, 141, .85) 0 18%, rgba(65, 79, 104, .67) 29%, rgba(34, 47, 70, 0) 49%),
        linear-gradient(180deg, rgba(76, 91, 116, .55), rgba(41, 54, 78, .74) 55%, rgba(31, 43, 64, .36));
      filter: blur(1.2px);
      box-shadow: 0 8px 22px rgba(5, 10, 22, .30);
      opacity: .97;
    }

    .cloud-wisp {
      position: absolute;
      left: 12%;
      top: 25%;
      width: 76%;
      height: 12%;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 30% 50%, rgba(87, 103, 128, .52) 0 28%, rgba(55, 70, 95, 0) 67%),
        radial-gradient(ellipse at 70% 50%, rgba(77, 92, 117, .46) 0 30%, rgba(48, 62, 86, 0) 68%);
      filter: blur(4px);
      opacity: .88;
    }

    .diagnostic-note {
      position: absolute;
      left: 1.2vw;
      bottom: 1.2vh;
      z-index: 4;
      padding: .45rem .7rem;
      border-radius: .35rem;
      background: rgba(0,0,0,.55);
      color: rgba(255,255,255,.90);
      font: 600 13px/1.2 system-ui, -apple-system, sans-serif;
      letter-spacing: .02em;
      pointer-events: none;
    }

    @keyframes cloud-crossing-test {
      0%, 7% {
        transform: translate3d(118%, 0, 0);
        opacity: 0;
      }
      12% {
        transform: translate3d(98%, 0, 0);
        opacity: 1;
      }
      38% {
        transform: translate3d(24%, 0, 0);
        opacity: 1;
      }
      56% {
        transform: translate3d(-10%, 0, 0);
        opacity: 1;
      }
      86% {
        transform: translate3d(-104%, 2%, 0);
        opacity: 1;
      }
      92%, 100% {
        transform: translate3d(-124%, 2%, 0);
        opacity: 0;
      }
    }

    @keyframes moon-veil-dim {
      0%, 24%, 76%, 100% { opacity: 0; }
      36% { opacity: .34; }
      45%, 59% { opacity: 1; }
      68% { opacity: .38; }
    }

    @keyframes room-moon-dim {
      0%, 25%, 75%, 100% { opacity: 0; }
      37% { opacity: .30; }
      46%, 59% { opacity: .82; }
      68% { opacity: .34; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Nighttime moon cloud-cover diagnostic">
    <img
      class="scene-image"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt="Nighttime Bed character staging artwork">

    <div class="room-dim" aria-hidden="true"></div>

    <div class="window-zone" aria-hidden="true">
      <div class="moon-veil"></div>
      <div class="cloud-track">
        <div class="cloud-main"></div>
        <div class="cloud-wisp"></div>
      </div>
    </div>

    <div class="diagnostic-note">CLOUD TEST v4 · exaggerated 16s crossing</div>
  </main>
</body>
</html>
