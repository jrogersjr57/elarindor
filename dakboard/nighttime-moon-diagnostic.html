<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0b">
  <title>Living Elarindor — Moon Cloud Cover Diagnostic v3</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0b0b;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0b0b;
    }

    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      z-index: 0;
    }

    /* Full-room response to the cloud covering the moon.
       This is intentionally accelerated for TV testing. */
    .room-dim {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 86% 15%,
          rgba(13, 25, 55, .08) 0%,
          rgba(10, 20, 45, .10) 28%,
          rgba(7, 14, 30, .13) 54%,
          rgba(5, 9, 20, .10) 74%,
          rgba(0, 0, 0, 0) 100%
        ),
        rgba(4, 8, 18, .10);
      opacity: 0;
      animation: room-moon-dim 18s ease-in-out infinite;
      will-change: opacity;
    }

    /* Approximate visible window opening in the approved staging image.
       The cloud is clipped here so it reads as outside, not inside the room. */
    .window-zone {
      position: absolute;
      left: 77.3%;
      top: 1.2%;
      width: 15.8%;
      height: 37.5%;
      overflow: hidden;
      z-index: 2;
      pointer-events: none;
    }

    /* A subtle localized veil helps the baked-in moon dim as the cloud passes. */
    .moon-veil {
      position: absolute;
      left: 58%;
      top: 1%;
      width: 35%;
      height: 33%;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(25, 38, 63, .72) 0%,
        rgba(28, 42, 68, .50) 42%,
        rgba(24, 37, 62, .18) 69%,
        rgba(0, 0, 0, 0) 100%
      );
      filter: blur(6px);
      opacity: 0;
      animation: moon-veil-dim 18s ease-in-out infinite;
      will-change: opacity;
    }

    .cloud-track {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      animation: cloud-crossing-test 18s linear infinite;
      will-change: transform, opacity;
    }

    .cloud-main,
    .cloud-wisp {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      mix-blend-mode: normal;
    }

    .cloud-main {
      left: 8%;
      top: 7%;
      width: 78%;
      height: 20%;
      background:
        radial-gradient(ellipse at 16% 58%, rgba(47, 62, 84, .68) 0 18%, rgba(47, 62, 84, 0) 42%),
        radial-gradient(ellipse at 35% 43%, rgba(58, 73, 96, .72) 0 24%, rgba(58, 73, 96, 0) 50%),
        radial-gradient(ellipse at 54% 55%, rgba(45, 59, 81, .76) 0 27%, rgba(45, 59, 81, 0) 52%),
        radial-gradient(ellipse at 74% 45%, rgba(62, 77, 101, .67) 0 22%, rgba(62, 77, 101, 0) 48%),
        radial-gradient(ellipse at 91% 58%, rgba(44, 58, 79, .60) 0 18%, rgba(44, 58, 79, 0) 42%),
        linear-gradient(
          180deg,
          rgba(41, 54, 75, .22) 0%,
          rgba(37, 50, 70, .48) 48%,
          rgba(31, 43, 62, .18) 100%
        );
      box-shadow: 0 6px 18px rgba(8, 14, 28, .16);
      opacity: .88;
    }

    .cloud-wisp {
      left: 17%;
      top: 18%;
      width: 65%;
      height: 10%;
      background:
        radial-gradient(ellipse at 25% 50%, rgba(68, 83, 106, .30) 0 25%, rgba(68, 83, 106, 0) 62%),
        radial-gradient(ellipse at 67% 50%, rgba(57, 72, 96, .30) 0 28%, rgba(57, 72, 96, 0) 64%);
      opacity: .75;
      filter: blur(4px);
    }

    .diagnostic-note {
      position: absolute;
      left: 1.2vw;
      bottom: 1.2vh;
      z-index: 4;
      padding: .45rem .7rem;
      border-radius: .35rem;
      background: rgba(0,0,0,.48);
      color: rgba(255,255,255,.82);
      font: 600 13px/1.2 system-ui, -apple-system, sans-serif;
      letter-spacing: .02em;
      pointer-events: none;
    }

    @keyframes cloud-crossing-test {
      0%, 8% {
        transform: translate3d(112%, 0, 0);
        opacity: 0;
      }
      13% {
        transform: translate3d(96%, 0, 0);
        opacity: .92;
      }
      42% {
        transform: translate3d(18%, 1%, 0);
        opacity: .96;
      }
      58% {
        transform: translate3d(-10%, 1%, 0);
        opacity: .96;
      }
      86% {
        transform: translate3d(-96%, 2%, 0);
        opacity: .88;
      }
      92%, 100% {
        transform: translate3d(-118%, 2%, 0);
        opacity: 0;
      }
    }

    @keyframes moon-veil-dim {
      0%, 24%, 78%, 100% { opacity: 0; }
      36% { opacity: .22; }
      46%, 58% { opacity: .82; }
      68% { opacity: .28; }
    }

    @keyframes room-moon-dim {
      0%, 25%, 77%, 100% { opacity: 0; }
      37% { opacity: .18; }
      47%, 58% { opacity: .62; }
      68% { opacity: .20; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Nighttime moon cloud-cover diagnostic">
    <img
      class="scene-image"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt="Nighttime Bed character staging artwork">

    <div class="room-dim" aria-hidden="true"></div>

    <div class="window-zone" aria-hidden="true">
      <div class="moon-veil"></div>
      <div class="cloud-track">
        <div class="cloud-main"></div>
        <div class="cloud-wisp"></div>
      </div>
    </div>

    <div class="diagnostic-note">CLOUD TEST · accelerated 18s moon cover</div>
  </main>
</body>
</html>
