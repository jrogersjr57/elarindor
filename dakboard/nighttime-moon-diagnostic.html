<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0b">
  <title>Living Elarindor — Moon Cloud Cover Diagnostic v7</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0b0b;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0b0b;
    }

    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      z-index: 0;
    }

    /* Keep the scene response subtle but visible during the accelerated test. */
    .room-dim {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 84% 14%,
          rgba(7, 14, 30, .18) 0%,
          rgba(7, 14, 30, .15) 28%,
          rgba(7, 14, 30, .10) 52%,
          rgba(7, 14, 30, .04) 72%,
          rgba(0, 0, 0, 0) 100%
        ),
        rgba(3, 7, 16, .08);
      opacity: 0;
      animation: room-moon-dim 16s ease-in-out infinite;
      will-change: opacity;
    }

    /* Small moon-only zone: nothing can spill over the curtains/window frame. */
    .moon-zone {
      position: absolute;
      left: 79.7%;
      top: 5.0%;
      width: 9.2%;
      height: 15.0%;
      overflow: hidden;
      z-index: 2;
      pointer-events: none;
      border-radius: 44% 52% 48% 55%;
    }

    /* Three soft irregular veils cross at slightly different heights.
       No circular shadow is used, so the moon should haze/dim rather than
       read like an eclipse or changing phase. */
    .wisp {
      position: absolute;
      left: 0;
      border-radius: 47% 58% 44% 61% / 63% 42% 58% 39%;
      filter: blur(5px);
      will-change: transform, opacity;
    }

    .wisp-a {
      top: 18%;
      width: 148%;
      height: 29%;
      background:
        radial-gradient(ellipse at 14% 52%, rgba(36,49,72,0) 0 16%, rgba(49,64,90,.30) 36%, rgba(61,78,106,.48) 53%, rgba(40,54,79,.14) 73%, rgba(0,0,0,0) 100%),
        radial-gradient(ellipse at 51% 48%, rgba(43,57,82,.08) 0 18%, rgba(56,72,99,.42) 38%, rgba(66,84,112,.58) 55%, rgba(42,56,82,.18) 74%, rgba(0,0,0,0) 100%),
        radial-gradient(ellipse at 82% 54%, rgba(35,48,71,0) 0 14%, rgba(50,65,91,.26) 36%, rgba(60,77,104,.43) 54%, rgba(38,52,76,.12) 73%, rgba(0,0,0,0) 100%);
      animation: wisp-a-pass 16s ease-in-out infinite;
    }

    .wisp-b {
      top: 35%;
      width: 132%;
      height: 23%;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(43,58,84,0) 0 18%, rgba(58,74,101,.25) 37%, rgba(70,87,115,.43) 55%, rgba(47,61,87,.12) 75%, rgba(0,0,0,0) 100%),
        radial-gradient(ellipse at 67% 48%, rgba(41,55,81,.06) 0 16%, rgba(55,71,98,.31) 38%, rgba(65,83,111,.48) 55%, rgba(42,56,82,.14) 74%, rgba(0,0,0,0) 100%);
      animation: wisp-b-pass 16s ease-in-out infinite;
    }

    .wisp-c {
      top: 5%;
      width: 120%;
      height: 19%;
      background:
        radial-gradient(ellipse at 38% 50%, rgba(44,59,86,0) 0 20%, rgba(59,76,103,.20) 40%, rgba(72,90,118,.38) 56%, rgba(49,63,89,.10) 75%, rgba(0,0,0,0) 100%);
      animation: wisp-c-pass 16s ease-in-out infinite;
    }

    .diagnostic-note {
      position: absolute;
      left: 1.2vw;
      bottom: 1.2vh;
      z-index: 4;
      padding: .45rem .7rem;
      border-radius: .35rem;
      background: rgba(0,0,0,.55);
      color: rgba(255,255,255,.90);
      font: 600 13px/1.2 system-ui, -apple-system, sans-serif;
      letter-spacing: .02em;
      pointer-events: none;
    }

    @keyframes wisp-a-pass {
      0%, 17%   { transform: translate3d(76%, 0, 0) rotate(-1deg); opacity: 0; }
      28%        { transform: translate3d(43%, 0, 0) rotate(-1deg); opacity: .42; }
      42%        { transform: translate3d(12%, 1%, 0) rotate(0deg); opacity: .82; }
      56%        { transform: translate3d(-15%, 1%, 0) rotate(1deg); opacity: .88; }
      70%        { transform: translate3d(-45%, 0, 0) rotate(1deg); opacity: .40; }
      83%, 100%  { transform: translate3d(-78%, 0, 0) rotate(1deg); opacity: 0; }
    }

    @keyframes wisp-b-pass {
      0%, 21%   { transform: translate3d(84%, 0, 0) rotate(1deg); opacity: 0; }
      34%        { transform: translate3d(44%, 0, 0) rotate(1deg); opacity: .30; }
      48%        { transform: translate3d(9%, -1%, 0) rotate(0deg); opacity: .70; }
      61%        { transform: translate3d(-18%, -1%, 0) rotate(-1deg); opacity: .72; }
      73%        { transform: translate3d(-48%, 0, 0) rotate(-1deg); opacity: .28; }
      86%, 100%  { transform: translate3d(-82%, 0, 0) rotate(-1deg); opacity: 0; }
    }

    @keyframes wisp-c-pass {
      0%, 13%   { transform: translate3d(88%, 0, 0); opacity: 0; }
      25%        { transform: translate3d(52%, 0, 0); opacity: .22; }
      38%        { transform: translate3d(18%, 0, 0); opacity: .54; }
      50%        { transform: translate3d(-8%, 0, 0); opacity: .58; }
      63%        { transform: translate3d(-38%, 0, 0); opacity: .24; }
      78%, 100%  { transform: translate3d(-76%, 0, 0); opacity: 0; }
    }

    @keyframes room-moon-dim {
      0%, 23%, 78%, 100% { opacity: 0; }
      36% { opacity: .16; }
      48%, 60% { opacity: .48; }
      70% { opacity: .18; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Nighttime moon cloud-cover diagnostic">
    <img
      class="scene-image"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt="Nighttime Bed character staging artwork">

    <div class="room-dim" aria-hidden="true"></div>

    <div class="moon-zone" aria-hidden="true">
      <div class="wisp wisp-a"></div>
      <div class="wisp wisp-b"></div>
      <div class="wisp wisp-c"></div>
    </div>

    <div class="diagnostic-note">CLOUD TEST v7 · irregular wisps · 16s</div>
  </main>
</body>
</html>
