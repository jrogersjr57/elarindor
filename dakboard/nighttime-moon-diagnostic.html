<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0b">
  <title>Living Elarindor — Moon Cloud Cover Diagnostic v8</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0b0b;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0b0b;
    }

    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      z-index: 0;
    }

    .room-dim {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 84% 14%,
          rgba(7, 14, 30, .18) 0%,
          rgba(7, 14, 30, .14) 30%,
          rgba(7, 14, 30, .09) 54%,
          rgba(7, 14, 30, .03) 74%,
          rgba(0, 0, 0, 0) 100%
        ),
        rgba(3, 7, 16, .07);
      opacity: 0;
      animation: room-moon-dim 16s ease-in-out infinite;
      will-change: opacity;
    }

    /* Moon-only zone, kept away from the window frame. */
    .moon-zone {
      position: absolute;
      left: 79.7%;
      top: 5.0%;
      width: 9.2%;
      height: 15.0%;
      overflow: hidden;
      z-index: 2;
      pointer-events: none;
      border-radius: 44% 52% 48% 55%;
    }

    /* v8 deliberately uses thin, separated streaks instead of overlapping
       soft blobs. The lower blur keeps each wisp visually distinct. */
    .wisp {
      position: absolute;
      left: 0;
      border-radius: 999px;
      filter: blur(1.2px);
      will-change: transform, opacity;
    }

    .wisp-a {
      top: 18%;
      width: 150%;
      height: 11%;
      background:
        linear-gradient(
          90deg,
          rgba(52,68,95,0) 0%,
          rgba(66,84,113,.20) 15%,
          rgba(77,96,126,.50) 35%,
          rgba(62,80,108,.58) 54%,
          rgba(79,98,128,.42) 72%,
          rgba(58,74,101,.12) 88%,
          rgba(52,68,95,0) 100%
        );
      animation: wisp-a-pass 16s ease-in-out infinite;
    }

    .wisp-b {
      top: 43%;
      width: 128%;
      height: 9%;
      background:
        linear-gradient(
          90deg,
          rgba(48,63,89,0) 0%,
          rgba(61,78,106,.18) 17%,
          rgba(73,91,120,.40) 39%,
          rgba(57,74,101,.50) 58%,
          rgba(71,89,118,.34) 76%,
          rgba(52,68,94,.10) 90%,
          rgba(48,63,89,0) 100%
        );
      animation: wisp-b-pass 16s ease-in-out infinite;
    }

    .wisp-c {
      top: 65%;
      width: 104%;
      height: 7%;
      background:
        linear-gradient(
          90deg,
          rgba(46,61,86,0) 0%,
          rgba(57,73,100,.14) 18%,
          rgba(68,86,114,.31) 43%,
          rgba(55,71,98,.38) 61%,
          rgba(65,82,110,.22) 79%,
          rgba(46,61,86,0) 100%
        );
      animation: wisp-c-pass 16s ease-in-out infinite;
    }

    .diagnostic-note {
      position: absolute;
      left: 1.2vw;
      bottom: 1.2vh;
      z-index: 4;
      padding: .45rem .7rem;
      border-radius: .35rem;
      background: rgba(0,0,0,.55);
      color: rgba(255,255,255,.90);
      font: 600 13px/1.2 system-ui, -apple-system, sans-serif;
      letter-spacing: .02em;
      pointer-events: none;
    }

    @keyframes wisp-a-pass {
      0%, 15%   { transform: translate3d(82%, 0, 0); opacity: 0; }
      27%        { transform: translate3d(48%, 0, 0); opacity: .42; }
      42%        { transform: translate3d(12%, 0, 0); opacity: .85; }
      56%        { transform: translate3d(-18%, 0, 0); opacity: .88; }
      70%        { transform: translate3d(-50%, 0, 0); opacity: .38; }
      83%, 100%  { transform: translate3d(-84%, 0, 0); opacity: 0; }
    }

    @keyframes wisp-b-pass {
      0%, 20%   { transform: translate3d(88%, 0, 0); opacity: 0; }
      33%        { transform: translate3d(50%, 0, 0); opacity: .32; }
      48%        { transform: translate3d(11%, 0, 0); opacity: .70; }
      62%        { transform: translate3d(-20%, 0, 0); opacity: .73; }
      74%        { transform: translate3d(-50%, 0, 0); opacity: .30; }
      87%, 100%  { transform: translate3d(-86%, 0, 0); opacity: 0; }
    }

    @keyframes wisp-c-pass {
      0%, 24%   { transform: translate3d(94%, 0, 0); opacity: 0; }
      36%        { transform: translate3d(54%, 0, 0); opacity: .22; }
      51%        { transform: translate3d(12%, 0, 0); opacity: .54; }
      64%        { transform: translate3d(-20%, 0, 0); opacity: .56; }
      76%        { transform: translate3d(-50%, 0, 0); opacity: .20; }
      89%, 100%  { transform: translate3d(-88%, 0, 0); opacity: 0; }
    }

    @keyframes room-moon-dim {
      0%, 23%, 78%, 100% { opacity: 0; }
      36% { opacity: .15; }
      49%, 61% { opacity: .45; }
      70% { opacity: .17; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Nighttime moon cloud-cover diagnostic">
    <img
      class="scene-image"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt="Nighttime Bed character staging artwork">

    <div class="room-dim" aria-hidden="true"></div>

    <div class="moon-zone" aria-hidden="true">
      <div class="wisp wisp-a"></div>
      <div class="wisp wisp-b"></div>
      <div class="wisp wisp-c"></div>
    </div>

    <div class="diagnostic-note">CLOUD TEST v8 · separated wisps · 16s</div>
  </main>
</body>
</html>
