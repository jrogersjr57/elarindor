<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0b">
  <title>Living Elarindor — Moon Cloud Cover Diagnostic v6</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0b0b;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0b0b;
    }

    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      z-index: 0;
    }

    /* Instead of drawing a visible cloud across the flattened window,
       this test simulates a cloud passing over the moon by locally veiling
       the baked-in moon and dimming the room's moonlight response. */
    .room-dim {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 84% 14%,
          rgba(6, 12, 27, .20) 0%,
          rgba(6, 12, 27, .17) 27%,
          rgba(6, 12, 27, .12) 50%,
          rgba(6, 12, 27, .05) 72%,
          rgba(0, 0, 0, 0) 100%
        ),
        rgba(3, 7, 16, .10);
      opacity: 0;
      animation: room-moon-dim 16s ease-in-out infinite;
      will-change: opacity;
    }

    /* Small zone centered on the painted moon only, intentionally kept
       away from curtains, mullions and most tree silhouettes. */
    .moon-zone {
      position: absolute;
      left: 79.7%;
      top: 5.0%;
      width: 9.2%;
      height: 15.0%;
      overflow: hidden;
      z-index: 2;
      pointer-events: none;
      border-radius: 50%;
    }

    .cloud-veil {
      position: absolute;
      left: 0;
      top: 11%;
      width: 145%;
      height: 75%;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 16% 50%, rgba(28, 40, 61, 0) 0 16%, rgba(38, 51, 74, .26) 34%, rgba(49, 63, 88, .46) 52%, rgba(31, 43, 65, .18) 72%, rgba(0,0,0,0) 100%),
        radial-gradient(ellipse at 46% 50%, rgba(32, 44, 67, .08) 0 18%, rgba(43, 57, 82, .44) 38%, rgba(56, 70, 96, .66) 54%, rgba(37, 49, 72, .22) 73%, rgba(0,0,0,0) 100%),
        radial-gradient(ellipse at 76% 50%, rgba(31, 43, 65, 0) 0 16%, rgba(42, 55, 80, .34) 35%, rgba(54, 68, 93, .54) 52%, rgba(34, 47, 69, .18) 72%, rgba(0,0,0,0) 100%);
      filter: blur(5px);
      transform: translate3d(70%, 0, 0);
      opacity: 0;
      animation: moon-cloud-pass 16s ease-in-out infinite;
      will-change: transform, opacity;
    }

    .moon-shadow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(
        circle at 50% 50%,
        rgba(18, 27, 44, .74) 0%,
        rgba(22, 32, 51, .58) 38%,
        rgba(27, 39, 61, .20) 68%,
        rgba(0,0,0,0) 100%
      );
      filter: blur(3px);
      opacity: 0;
      animation: moon-shadow-dim 16s ease-in-out infinite;
      will-change: opacity;
    }

    .diagnostic-note {
      position: absolute;
      left: 1.2vw;
      bottom: 1.2vh;
      z-index: 4;
      padding: .45rem .7rem;
      border-radius: .35rem;
      background: rgba(0,0,0,.55);
      color: rgba(255,255,255,.90);
      font: 600 13px/1.2 system-ui, -apple-system, sans-serif;
      letter-spacing: .02em;
      pointer-events: none;
    }

    @keyframes moon-cloud-pass {
      0%, 18% {
        transform: translate3d(78%, 0, 0);
        opacity: 0;
      }
      28% {
        transform: translate3d(42%, 0, 0);
        opacity: .50;
      }
      42% {
        transform: translate3d(10%, 0, 0);
        opacity: .88;
      }
      55% {
        transform: translate3d(-13%, 0, 0);
        opacity: .92;
      }
      70% {
        transform: translate3d(-45%, 0, 0);
        opacity: .52;
      }
      82%, 100% {
        transform: translate3d(-78%, 0, 0);
        opacity: 0;
      }
    }

    @keyframes moon-shadow-dim {
      0%, 24%, 78%, 100% { opacity: 0; }
      36% { opacity: .20; }
      47%, 59% { opacity: .78; }
      69% { opacity: .22; }
    }

    @keyframes room-moon-dim {
      0%, 25%, 77%, 100% { opacity: 0; }
      38% { opacity: .18; }
      48%, 59% { opacity: .56; }
      69% { opacity: .20; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Nighttime moon cloud-cover diagnostic">
    <img
      class="scene-image"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt="Nighttime Bed character staging artwork">

    <div class="room-dim" aria-hidden="true"></div>

    <div class="moon-zone" aria-hidden="true">
      <div class="cloud-veil"></div>
      <div class="moon-shadow"></div>
    </div>

    <div class="diagnostic-note">CLOUD TEST v6 · moon-only veil · 16s</div>
  </main>
</body>
</html>
