<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0b">
  <title>Living Elarindor — Moonlight Cloud Diagnostic v10</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0b0b;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0b0b;
    }

    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      z-index: 0;
    }

    /* v10: no cloud shape and no moon-localized mask at all.
       The whole scene simply experiences a soft moonlight dip, strongest
       near the window, then recovers. This avoids eclipse/crescent artifacts. */
    .cloud-light-dip {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 84% 14%,
          rgba(4, 8, 18, .30) 0%,
          rgba(4, 8, 18, .22) 26%,
          rgba(4, 8, 18, .14) 48%,
          rgba(4, 8, 18, .06) 70%,
          rgba(0, 0, 0, 0) 100%
        ),
        linear-gradient(
          180deg,
          rgba(3, 7, 16, .10) 0%,
          rgba(3, 7, 16, .06) 55%,
          rgba(3, 7, 16, .02) 100%
        );
      opacity: 0;
      animation: cloud-light-dip 16s ease-in-out infinite;
      will-change: opacity;
    }

    .diagnostic-note {
      position: absolute;
      left: 1.2vw;
      bottom: 1.2vh;
      z-index: 4;
      padding: .45rem .7rem;
      border-radius: .35rem;
      background: rgba(0,0,0,.55);
      color: rgba(255,255,255,.90);
      font: 600 13px/1.2 system-ui, -apple-system, sans-serif;
      letter-spacing: .02em;
      pointer-events: none;
    }

    @keyframes cloud-light-dip {
      0%, 22%   { opacity: 0; }
      35%        { opacity: .20; }
      48%, 60%  { opacity: .72; }
      72%        { opacity: .24; }
      82%, 100%  { opacity: 0; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Nighttime moonlight cloud-cover diagnostic">
    <img
      class="scene-image"
      src="./assets/images/nighttime-bed-character-staging-v1.png?v=1"
      alt="Nighttime Bed character staging artwork">

    <div class="cloud-light-dip" aria-hidden="true"></div>

    <div class="diagnostic-note">CLOUD TEST v10 · light dip only · 16s</div>
  </main>
</body>
</html>
