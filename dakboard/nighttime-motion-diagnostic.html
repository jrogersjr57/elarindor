<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0b">
  <title>Living Elarindor — Motion Diagnostic</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0b0b;
    }
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0b0b;
    }
    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }
    .motion-test {
      position: absolute;
      top: 18vh;
      left: -28vw;
      width: 28vw;
      height: 18vh;
      border-radius: 2vh;
      background: rgba(255, 180, 72, .78);
      box-shadow: 0 0 8vh rgba(255, 180, 72, .72);
      display: grid;
      place-items: center;
      color: white;
      font: 700 clamp(26px, 4vw, 70px)/1 sans-serif;
      letter-spacing: .08em;
      text-shadow: 0 2px 8px rgba(0,0,0,.8);
      animation: sweep 4s linear infinite;
      will-change: transform;
    }
    .pulse-test {
      position: absolute;
      right: 7vw;
      bottom: 8vh;
      width: 13vh;
      height: 13vh;
      min-width: 90px;
      min-height: 90px;
      border-radius: 50%;
      background: rgba(120, 210, 255, .88);
      box-shadow: 0 0 7vh rgba(120, 210, 255, .9);
      animation: pulse 1.5s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }
    @keyframes sweep {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(156vw, 0, 0); }
    }
    @keyframes pulse {
      from { transform: scale(.65); opacity: .35; }
      to   { transform: scale(1.45); opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="CSS animation diagnostic">
    <img class="scene-image" src="./assets/images/nighttime-bed-character-staging-v1.png?v=1" alt="Nighttime Bed scene">
    <div class="motion-test">MOTION TEST</div>
    <div class="pulse-test" aria-hidden="true"></div>
  </main>
</body>
</html>
