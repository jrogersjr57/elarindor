<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100d0d">
  <title>Living Elarindor</title>
  <link rel="stylesheet" href="./assets/css/dashboard.css?v=7">
  <link rel="stylesheet" href="./assets/css/ambient-motion.css?v=7">
</head>
<body>
  <main id="living-space" aria-label="Living Elarindor dashboard">
    <div id="scene-root" aria-live="off"></div>

    <div class="hud" aria-live="polite">
      <div class="clock" aria-label="Current date and time">
        <div class="time" id="time">--:--</div>
        <div class="date" id="date">Loading date</div>
      </div>

      <section class="quest-panel" aria-label="Current quest">
        <div class="eyebrow" id="quest-eyebrow">Living Elarindor</div>
        <div class="quest-title" id="quest-title">Build the Living Window</div>
      </section>

      <div class="location" id="location">Elarindor</div>
    </div>

    <div class="debug-panel" id="debug-panel" aria-label="Scene testing controls"></div>
    <div class="status" id="status" aria-live="polite">Starting Living Elarindor…</div>
  </main>

  <script src="./assets/js/dashboard.js?v=7"></script>
</body>
</html>
