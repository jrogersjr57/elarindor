<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Elarindor · Autumn daytime adventures</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100e0b}
    #scene-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#100e0b}
  </style>
</head>
<body>
  <iframe id="scene-frame" src="./source/daytime-adventures-source.html" title="Vaelyn and Toma on an autumn adventure" scrolling="no"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('scene-frame');
      const params = new URLSearchParams(window.location.search);
      const position = params.get('position') || 'center center';

      function applyFit() {
        try {
          const doc = frame.contentDocument;
          if (!doc) return;

          doc.documentElement.style.width = '100%';
          doc.documentElement.style.height = '100%';
          doc.documentElement.style.margin = '0';
          doc.documentElement.style.overflow = 'hidden';

          if (doc.body) {
            doc.body.style.width = '100%';
            doc.body.style.height = '100%';
            doc.body.style.margin = '0';
            doc.body.style.overflow = 'hidden';
          }

          doc.querySelectorAll('img,video').forEach(media => {
            media.style.width = '100%';
            media.style.height = '100%';
            media.style.objectFit = 'cover';
            media.style.objectPosition = position;
          });
        } catch (_) {
          // Same-origin GitHub Pages content should be accessible.
        }
      }

      frame.addEventListener('load', applyFit);
      window.addEventListener('resize', applyFit);
    })();
  </script>
</body>
</html>
